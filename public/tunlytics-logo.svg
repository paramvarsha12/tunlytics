<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1DB954"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background: transparent -->

  <!-- Icon: waveform bars, centered vertically -->
  <g filter="url(#glow)">
    <rect x="4"  y="30" width="5" height="10" rx="2.5" fill="#1DB954" opacity="0.45"/>
    <rect x="11" y="22" width="5" height="18" rx="2.5" fill="#1DB954" opacity="0.7"/>
    <rect x="18" y="12" width="5" height="36" rx="2.5" fill="#1DB954"/>
    <rect x="25" y="20" width="5" height="22" rx="2.5" fill="#1DB954" opacity="0.7"/>
    <rect x="32" y="28" width="5" height="12" rx="2.5" fill="#1DB954" opacity="0.45"/>
  </g>

  <!-- Wordmark -->
  <text
    x="52"
    y="39"
    font-family="'Courier New', Courier, monospace"
    font-size="25"
    font-weight="800"
    letter-spacing="5"
    fill="#ffffff"
  >TUNLYTICS</text>

  <!-- Green underline accent -->
  <rect x="52" y="45" width="218" height="1.5" rx="1" fill="#1DB954" opacity="0.35"/>
</svg>
